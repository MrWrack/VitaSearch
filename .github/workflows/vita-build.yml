name: Build VitaSearch

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'vita/**'
      - '.github/workflows/vita-build.yml'
  pull_request:
    paths:
      - 'vita/**'
      - '.github/workflows/vita-build.yml'

permissions:
  contents: read

concurrency:
  group: vitasearch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vpk:
    name: VitaSDK Release Build
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install host tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake make ninja-build pkg-config ca-certificates curl
          rm -rf /var/lib/apt/lists/*

      - name: Install Vita libraries
        run: |
          vdpm refresh nightly || true

          vdpm remove curl || true

          vdpm install \
            zlib \
            bzip2 \
            libpng \
            libjpeg-turbo \
            freetype \
            libvita2d \
            mbedtls \
            zstd

          # VitaSDK's vdpm currently returns SIGPIPE/141 after completing this
          # replacement in the container. Do not trust its exit status here:
          # continue, then verify the resulting libcurl archive directly.
          vdpm install curl-mbedtls <<< "y" || true

          echo "curl-mbedtls replacement command returned"

          # VDPM exits 141 after extraction in this container. Install the
          # official curl-mbedtls release archive directly so the extracted
          # package cannot be left half-committed/rolled back.
          rm -rf /tmp/curl-mbedtls-pkg /tmp/curl-mbedtls.tar.xz
          mkdir -p /tmp/curl-mbedtls-pkg
          curl -fL --retry 3 \
            https://github.com/vitasdk/packages/releases/download/master/curl-mbedtls.tar.xz \
            -o /tmp/curl-mbedtls.tar.xz

          echo "=== curl-mbedtls archive layout ==="
          tar -tJf /tmp/curl-mbedtls.tar.xz | head -80 || true
          tar -xJf /tmp/curl-mbedtls.tar.xz -C /tmp/curl-mbedtls-pkg

          # Do not depend on the archive's top-level directory layout.
          # Locate the actual mbedTLS libcurl archive and copy it to the exact
          # linker path used by arm-vita-eabi-gcc.
          MBED_LIBCURL="$(find /tmp/curl-mbedtls-pkg -type f -name libcurl.a -print -quit)"
          if [ -z "$MBED_LIBCURL" ]; then
            echo "ERROR: curl-mbedtls archive does not contain libcurl.a"
            find /tmp/curl-mbedtls-pkg -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "Found mbedTLS libcurl: $MBED_LIBCURL"
          rm -f "$VITASDK/arm-vita-eabi/lib/libcurl.a"
          cp -f "$MBED_LIBCURL" "$VITASDK/arm-vita-eabi/lib/libcurl.a"

          # Copy curl headers/pkg-config metadata too when present.
          CURL_INCLUDE="$(find /tmp/curl-mbedtls-pkg -type d -path '*/include/curl' -print -quit)"
          if [ -n "$CURL_INCLUDE" ]; then
            mkdir -p "$VITASDK/arm-vita-eabi/include/curl"
            cp -a "$CURL_INCLUDE"/. "$VITASDK/arm-vita-eabi/include/curl/"
          fi

          CURL_PC="$(find /tmp/curl-mbedtls-pkg -type f -name libcurl.pc -print -quit)"
          if [ -n "$CURL_PC" ]; then
            mkdir -p "$VITASDK/arm-vita-eabi/lib/pkgconfig"
            cp -f "$CURL_PC" "$VITASDK/arm-vita-eabi/lib/pkgconfig/libcurl.pc"
          fi

          test -f "$VITASDK/arm-vita-eabi/lib/libcurl.a"

          echo "=== forced curl-mbedtls libcurl installed ==="
          ls -lh "$VITASDK/arm-vita-eabi/lib/libcurl.a"
          echo "Linker path now points at the archive extracted from curl-mbedtls."

      - name: Show toolchain versions
        run: |
          echo "VITASDK=$VITASDK"
          arm-vita-eabi-gcc --version
          cmake --version
          vdpm list > /tmp/vdpm-list.txt || true
          head -100 /tmp/vdpm-list.txt

      - name: Configure VitaSearch
        working-directory: vita
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VPK
        working-directory: vita
        run: cmake --build build --parallel 2

      - name: Verify VPK exists
        run: |
          test -f vita/build/VitaSearch.vpk
          ls -lh vita/build/VitaSearch.vpk

      - name: Upload VitaSearch VPK
        uses: actions/upload-artifact@v7
        with:
          name: VitaSearch-VPK
          path: vita/build/VitaSearch.vpk
          if-no-files-found: error
